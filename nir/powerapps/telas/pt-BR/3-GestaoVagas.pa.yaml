                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        DisabledFill: =corBorda
                        DisabledColor: =corTextoSuave
                        HoverColor: =corPrimaria
                        BorderColor: =corPrimaria
                  - lblDestinoV:
