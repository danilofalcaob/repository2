                      Properties:
                        Text: |-
                          ="Atendimento " & varPacSel.Title & " · " & Coalesce(LookUp(colSetores; Codigo = varPacSel.SetorCodigo; Sigla); varPacSel.SetorCodigo) & " leito " & varPacSel.Leito & If(IsBlank(varPacSel.DataInternacao); ""; " · " & DateDiff(varPacSel.DataInternacao; Today(); TimeUnit.Days) & " dias de internação")
                        X: =16
                        Y: =34
                        Width: =Parent.Width - 140
                        Height: =20
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =10
                        Color: =corTextoSuave
                  - btnFecharSelV:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: |-
                          ="Fechar"
                        OnSelect: |-
