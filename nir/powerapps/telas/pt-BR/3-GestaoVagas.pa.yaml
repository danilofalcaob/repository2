                        X: =Parent.Width - 112
                        Y: =10
                        Width: =96
                        Height: =32
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =10
                        FontWeight: =FontWeight.Semibold
                        Fill: =Color.White
