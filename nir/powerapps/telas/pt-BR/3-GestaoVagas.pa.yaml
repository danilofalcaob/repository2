                  Y: =16
                  Width: =120
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Fill: =corPrimaria
                  Color: =Color.White
                  HoverFill: =corPrimariaEscura
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =0
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
            - recPacientesV:
