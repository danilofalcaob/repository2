                  PressedFill: =corPrimariaEscura
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  BorderColor: =corPrimaria
            - btnAbaHistV:
