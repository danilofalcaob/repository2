                      Properties:
                        Text: |-
                          ="Setor de destino"
                        X: =16
                        Y: =60
                        Width: =260
                        Height: =18
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =9
                        Color: =corTextoSuave
                  - drpDestinoV:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        Items: |-
                          =ForAll(Filter(colSetores; Ativo && RecebeSolicitacao && Codigo <> varPacSel.SetorCodigo) As s; {Value: s.Title; Codigo: s.Codigo})
                        X: =16
                        Y: =78
                        Width: =260
                        Height: =36
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =11
                        BorderColor: =corBorda
                        ChevronBackground: =corPrimaria
                        AllowEmptySelection: =true
                        Default: =Blank()
                  - lblCondV:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="Condição de transporte"
                        X: =288
                        Y: =60
                        Width: =220
                        Height: =18
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =9
                        Color: =corTextoSuave
                  - drpCondicaoV:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        Items: =tblCondicoes
                        X: =288
                        Y: =78
                        Width: =220
                        Height: =36
