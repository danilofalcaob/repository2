                        Y: =26
                        Width: =270
                        Height: =18
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =9
                        Color: =corTextoSuave
                  - lblVagaPacV:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =With({s: LookUp(colVagasAbertas; Title = ThisItem.Title)}; If(IsBlank(s.ID); ""; "● Vaga → " & Coalesce(LookUp(colSetores; Codigo = s.SetorDestino; Sigla); s.SetorDestino) & " · " & LookUp(tblStatusVaga; Codigo = s.Status; Value)))
