                                  "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexTexto & "'>" & If(IsBlank(media); "–"; media >= 60; RoundDown(media / 60; 0) & "h " & Text(Mod(media; 60); "00") & "min"; Text(media; "0") & " min") & "</div>" &
                                  "<div style='font-size:11px;color:#5A6573'>" & "mediana: " & If(IsBlank(mediana); "–"; mediana >= 60; RoundDown(mediana / 60; 0) & "h " & Text(Mod(mediana; 60); "00") & "min"; Text(mediana; "0") & " min") & "</div>" &
                              "</div>" &
                                      "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                                  "<div style='font-size:12px;color:#5A6573'>Dentro do SLA</div>" &
                                  "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & If(nc = 0; hexTexto; nSla / nc >= 0,8; hexVerde; hexVermelho) & "'>" & If(nc = 0; "–"; Text(nSla / nc * 100; "0") & "%") & "</div>" &
                                  "<div style='font-size:11px;color:#5A6573'>" & nSla & " de " & nc & " cessões" & "</div>" &
                              "</div>" &
                                      "</div>" &
                                      "<table style='width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;color:#1A2330'>" &
                                      "<tr style='text-align:left;color:#5A6573;border-bottom:1px solid #D8DEE6'><th>Destino</th><th>Solicitações</th><th>Cedidas</th><th>Tempo médio</th><th>No SLA</th></tr>" &
                                      Concat(
                                          Sort(
                                              AddColumns(
                                                  GroupBy(colHistF; SetorDestino; Itens);
                                                  Qt; CountRows(Itens);
                                                  Ced; CountRows(Filter(Itens; !IsBlank(MinutosAteCessao)));
                                                  Med; IfError(Average(Filter(Itens; !IsBlank(MinutosAteCessao)); MinutosAteCessao); Blank());
                                                  Sla; CountRows(Filter(Itens; DentroSLA = "SIM"))
                                              );
                                              Qt;
                                              SortOrder.Descending
                                          );
                                          "<tr style='border-bottom:1px solid #EEF1F4'><td>" & Coalesce(LookUp(colSetores; Codigo = SetorDestino; Sigla); SetorDestino) & "</td><td>" & Qt & "</td><td>" & Ced & "</td><td>" &
                                          If(Ced = 0; "–"; Text(Med; "0") & " min") & "</td><td>" & If(Ced = 0; "–"; Text(Sla / Ced * 100; "0") & "%") & "</td></tr>"
                                      ) &
                                      "</table></div>"
                                  )
                              )
                          )
