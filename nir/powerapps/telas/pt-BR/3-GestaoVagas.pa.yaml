                  Color: |-
                    =If(ThisItem.Disponivel; Color.White; RGBA(255; 255; 255; 0,55))
                  HoverFill: |-
                    =RGBA(255; 255; 255; 0,12)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =0
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
