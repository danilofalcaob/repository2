                  Font: |-
                    =Font.'Segoe UI'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Fill: |-
                    =If(varAbaVagas = "HIST"; corPrimaria; Color.White)
                  Color: |-
                    =If(varAbaVagas = "HIST"; Color.White; corPrimaria)
