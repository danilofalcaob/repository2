                          =With({s: LookUp(colVagasAbertas; Title = varPacSel.Title)}; If(IsBlank(s.ID); If(gPodeSolicitar; ""; "Seu perfil é só de visualização."); "Já existe solicitação em aberto para " & Coalesce(LookUp(colSetores; Codigo = s.SetorDestino; Sigla); s.SetorDestino) & " (" & LookUp(tblStatusVaga; Codigo = s.Status; Value) & ")."))
