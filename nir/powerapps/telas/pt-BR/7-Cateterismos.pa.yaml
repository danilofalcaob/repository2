Screens:
  scrCateterismos:
    Properties:
      Fill: =corFundo
      OnVisible: |-
        =If(IsBlank(varCatePeriodo); Set(varCatePeriodo; "DIA"));; If(IsBlank(varDiaCate); Set(varDiaCate; Today()));; Set(varFormCate; false);; Set(varImportCate; false);; Set(varEditCT; Blank());;
        Select(btnAtualizarCT)
    Children:
      - recLateralCT:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =200
            Height: =Parent.Height
            Fill: =corPrimariaEscura
            BorderColor: =corBorda
            BorderThickness: =0
            Visible: =!varModoTV
      - lblMarcaCT:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="NIR · Command Center"
            X: =16
            Y: =14
            Width: =176
            Height: =30
            Font: |-
              =Font.'Segoe UI'
            Size: =14
            Color: =Color.White
            FontWeight: =FontWeight.Semibold
            Visible: =!varModoTV
      - lblHospitalCT:
          Control: Label@2.5.1
          Properties:
            Text: =gNomeHospital
            X: =16
            Y: =42
            Width: =176
            Height: =22
            Font: |-
              =Font.'Segoe UI'
            Size: =9
            Color: |-
              =RGBA(255; 255; 255; 0,75)
            Visible: =!varModoTV
      - galMenuCT:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =tblMenuUsuario
            X: =8
            Y: =80
            Width: =184
            Height: =Parent.Height - 170
            TemplateSize: =46
            TemplatePadding: =0
            ShowScrollbar: =false
            Visible: =!varModoTV
          Children:
            - btnMenuItemCT:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    =ThisItem.Rotulo & If(ThisItem.Disponivel; ""; "  ·  em breve")
                  OnSelect: |-
                    =If(
                        !ThisItem.Disponivel;
                        Notify(ThisItem.Rotulo & " chega nas próximas fases do projeto."; NotificationType.Information);
                        Switch(
                            ThisItem.Codigo;
                            "PRINCIPAL"; Navigate(scrPrincipal; ScreenTransition.None);
                            "ROTINA"; Navigate(scrRotina; ScreenTransition.None);
                            "VAGAS"; Navigate(scrVagas; ScreenTransition.None);
                            "METAS"; Navigate(scrMetas; ScreenTransition.None);
                            "PREVISOES"; Navigate(scrPrevisoes; ScreenTransition.None);
                            "PERMANENCIA"; Navigate(scrPermanencia; ScreenTransition.None);
                            "AMBULANCIAS"; Navigate(scrAmbulancias; ScreenTransition.None);
                            "CATETERISMOS"; Navigate(scrCateterismos; ScreenTransition.None);
                            "PASSAGEM"; Navigate(scrPassagem; ScreenTransition.None);
                            "RECEPCAO"; Navigate(scrRecepcao; ScreenTransition.None)
                        )
                    )
                  X: =0
                  Y: =2
                  Width: =Parent.TemplateWidth
                  Height: =40
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Fill: |-
                    =If(ThisItem.Codigo = "CATETERISMOS"; corPrimaria; Color.Transparent)
                  Color: |-
                    =If(ThisItem.Disponivel; Color.White; RGBA(255; 255; 255; 0,55))
                  HoverFill: |-
                    =RGBA(255; 255; 255; 0,12)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =0
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  Align: =Align.Left
                  PaddingLeft: =12
                  HoverColor: =Color.White
      - lblUsuarioCT:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =gUsuarioNome & Char(10) & "Perfil: " & gPerfil
            X: =16
            Y: =Parent.Height - 72
            Width: =176
            Height: =56
            Font: |-
              =Font.'Segoe UI'
            Size: =9
            Color: |-
              =RGBA(255; 255; 255; 0,85)
            Visible: =!varModoTV
            VerticalAlign: =VerticalAlign.Bottom
      - conCT:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            X: |-
              =If(varModoTV; 0; 200)
            Y: =0
            Width: =Parent.Width - Self.X
            Height: =Parent.Height
            Fill: =corFundo
          Children:
            - lblTituloCT:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    ="Cateterismos"
                  X: =20
                  Y: =10
                  Width: =560
                  Height: =30
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =18
                  Color: =corTexto
                  FontWeight: =FontWeight.Semibold
            - lblRelogioCT:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    =Text(varRelogio; "dddd, dd/mm/yyyy · hh:mm:ss") & "   ·   atualizado às " & Text(varUltimaAtualizacao; "hh:mm")
                  X: =20
                  Y: =40
                  Width: =620
                  Height: =20
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  Color: =corTextoSuave
            - btnAtualizarCT:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="Atualizar"
                  OnSelect: |-
                    =Refresh(Cateterismos);;
                    Refresh(Internacoes);;
                    ClearCollect(colInternados; Filter(Internacoes; Status = "INTERNADO"));;
                    ClearCollect(colCate; Filter(Cateterismos; DataHoraExame >= DateAdd(Today(); -30; TimeUnit.Days)));;
                    Set(varUltimaAtualizacao; Now())
                  X: =Parent.Width - 140
                  Y: =16
                  Width: =120
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Fill: =corPrimaria
                  Color: =Color.White
                  HoverFill: =corPrimariaEscura
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =0
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
            - htmlKpisCT:
                Control: HtmlViewer@2.1.0
                Properties:
                  HtmlText: |-
                    =With(
                        {
                            hoje: Filter(colCate; ChaveData = Text(Today(); "yyyy-mm-dd") && Status <> "CANCELADO");
                            amanha: Filter(colCate; ChaveData = Text(DateAdd(Today(); 1; TimeUnit.Days); "yyyy-mm-dd") && (Status = "AGENDADO" || Status = "REMARCADO"));
                            semana: Filter(colCate; DataHoraExame >= Today() && DataHoraExame < DateAdd(Today(); 7; TimeUnit.Days) && (Status = "AGENDADO" || Status = "REMARCADO"));
                            aguard: Filter(colCate; (Status = "AGENDADO" || Status = "REMARCADO") && (Tipo = "INTERNADO_ELETIVO" || Tipo = "INTERNADO_URGENCIA"));
                            canc30: Filter(colCate; (Status = "CANCELADO" || Status = "SUSPENSO") && DataHoraExame < Now())
                        };
                        With(
                            {diasAguard: Average(AddColumns(aguard; D; DateDiff(LookUp(colInternados; Title = NrAtendimento; DataInternacao); Today(); TimeUnit.Days)); D)};
                            "<div style='display:flex;flex-wrap:wrap;gap:12px;font-family:Segoe UI,Arial,sans-serif'>" &
                            "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                            "<div style='font-size:12px;color:#5A6573'>Cateterismos hoje</div>" &
                            "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexTexto & "'>" & CountRows(hoje) & "</div>" &
                            "<div style='font-size:11px;color:#5A6573'>" & Concat(tblTiposCate As t; t.Value & ": " & CountRows(Filter(hoje; Tipo = t.Codigo)); " · ") & "</div>" &
                        "</div>" &
                            "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                            "<div style='font-size:12px;color:#5A6573'>Amanhã</div>" &
                            "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexTexto & "'>" & CountRows(amanha) & "</div>" &
                            "<div style='font-size:11px;color:#5A6573'>" & "próximos 7 dias: " & CountRows(semana) & "</div>" &
                        "</div>" &
                            "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                            "<div style='font-size:12px;color:#5A6573'>Internados aguardando</div>" &
                            "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & If(CountRows(aguard) > 0; hexAmarelo; hexTexto) & "'>" & CountRows(aguard) & "</div>" &
                            "<div style='font-size:11px;color:#5A6573'>" & If(CountRows(aguard) = 0; "nenhum"; "internados há " & IfError(Text(diasAguard; "0"); "–") & " dias em média") & "</div>" &
                        "</div>" &
                            "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                            "<div style='font-size:12px;color:#5A6573'>Cancelados/suspensos (30 d)</div>" &
                            "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexTexto & "'>" & CountRows(canc30) & "</div>" &
                            "<div style='font-size:11px;color:#5A6573'>" & "no período" & "</div>" &
                        "</div>" &
                            "</div>"
                        )
                    )
                  X: =20
                  Y: =66
                  Width: =Parent.Width - 40
                  Height: =96
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - btnPerDiaCT:
