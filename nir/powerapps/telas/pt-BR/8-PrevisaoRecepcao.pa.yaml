                          =If(IsBlank(ThisItem.DataCateterismo); "08:00"; Text(ThisItem.DataCateterismo; "hh:mm"))
                        X: =356
                        Y: =72
                        Width: =64
                        Height: =34
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =11
                        BorderColor: =corBorda
                        Visible: =varCateEditRC = ThisItem.ID
                  - drpTipoCateAmbRC:
                      Control: Classic/DropDown@2.3.1
                      Properties:
