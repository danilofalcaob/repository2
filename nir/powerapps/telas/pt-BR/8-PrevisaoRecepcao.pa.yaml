Screens:
  scrRecepcao:
    Properties:
      Fill: =corFundo
      OnVisible: |-
        =If(IsBlank(varAbaRecep); Set(varAbaRecep; "PROXIMOS"));; Set(varFormRecep; false);; Set(varEditRC; Blank());; Set(varCateEditRC; Blank());;
        Select(btnAtualizarRC)
    Children:
      - recLateralRC:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =200
            Height: =Parent.Height
            Fill: =corPrimariaEscura
            BorderColor: =corBorda
            BorderThickness: =0
            Visible: =!varModoTV
      - lblMarcaRC:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="NIR · Command Center"
            X: =16
            Y: =14
            Width: =176
            Height: =30
            Font: |-
              =Font.'Segoe UI'
            Size: =14
            Color: =Color.White
            FontWeight: =FontWeight.Semibold
            Visible: =!varModoTV
      - lblHospitalRC:
          Control: Label@2.5.1
          Properties:
            Text: =gNomeHospital
            X: =16
            Y: =42
            Width: =176
            Height: =22
            Font: |-
              =Font.'Segoe UI'
            Size: =9
            Color: |-
              =RGBA(255; 255; 255; 0,75)
            Visible: =!varModoTV
      - galMenuRC:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =tblMenuUsuario
            X: =8
            Y: =80
            Width: =184
            Height: =Parent.Height - 170
            TemplateSize: =46
            TemplatePadding: =0
            ShowScrollbar: =false
            Visible: =!varModoTV
          Children:
            - btnMenuItemRC:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    =ThisItem.Rotulo & If(ThisItem.Disponivel; ""; "  ·  em breve")
                  OnSelect: |-
                    =If(
                        !ThisItem.Disponivel;
                        Notify(ThisItem.Rotulo & " chega nas próximas fases do projeto."; NotificationType.Information);
                        Switch(
                            ThisItem.Codigo;
                            "PRINCIPAL"; Navigate(scrPrincipal; ScreenTransition.None);
                            "ROTINA"; Navigate(scrRotina; ScreenTransition.None);
                            "VAGAS"; Navigate(scrVagas; ScreenTransition.None);
                            "METAS"; Navigate(scrMetas; ScreenTransition.None);
                            "PREVISOES"; Navigate(scrPrevisoes; ScreenTransition.None);
                            "PERMANENCIA"; Navigate(scrPermanencia; ScreenTransition.None);
                            "AMBULANCIAS"; Navigate(scrAmbulancias; ScreenTransition.None);
                            "CATETERISMOS"; Navigate(scrCateterismos; ScreenTransition.None);
                            "PASSAGEM"; Navigate(scrPassagem; ScreenTransition.None);
                            "RECEPCAO"; Navigate(scrRecepcao; ScreenTransition.None)
                        )
                    )
                  X: =0
                  Y: =2
                  Width: =Parent.TemplateWidth
                  Height: =40
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Fill: |-
                    =If(ThisItem.Codigo = "RECEPCAO"; corPrimaria; Color.Transparent)
                  Color: |-
                    =If(ThisItem.Disponivel; Color.White; RGBA(255; 255; 255; 0,55))
                  HoverFill: |-
                    =RGBA(255; 255; 255; 0,12)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =0
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  Align: =Align.Left
                  PaddingLeft: =12
                  HoverColor: =Color.White
      - lblUsuarioRC:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =gUsuarioNome & Char(10) & "Perfil: " & gPerfil
            X: =16
            Y: =Parent.Height - 72
            Width: =176
            Height: =56
            Font: |-
              =Font.'Segoe UI'
            Size: =9
            Color: |-
              =RGBA(255; 255; 255; 0,85)
            Visible: =!varModoTV
            VerticalAlign: =VerticalAlign.Bottom
      - conRC:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            X: |-
              =If(varModoTV; 0; 200)
            Y: =0
            Width: =Parent.Width - Self.X
            Height: =Parent.Height
            Fill: =corFundo
          Children:
            - lblTituloRC:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    ="Previsão de Recepção · CROSS"
                  X: =20
                  Y: =10
                  Width: =560
                  Height: =30
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =18
                  Color: =corTexto
                  FontWeight: =FontWeight.Semibold
            - lblRelogioRC:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    =Text(varRelogio; "dddd, dd/mm/yyyy · hh:mm:ss") & "   ·   atualizado às " & Text(varUltimaAtualizacao; "hh:mm")
                  X: =20
                  Y: =40
                  Width: =620
                  Height: =20
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  Color: =corTextoSuave
            - btnAtualizarRC:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="Atualizar"
                  OnSelect: |-
                    =Refresh(Recepcoes);;
                    Refresh(Cateterismos);;
                    ClearCollect(colRecep; Filter(Recepcoes; Status = "PREVISTO" || Status = "CHEGOU"));;
                    ClearCollect(colRecepHist; Filter(Recepcoes; DesfechoEm >= DateAdd(Today(); -30; TimeUnit.Days)));;
                    Set(varUltimaAtualizacao; Now())
                  X: =Parent.Width - 140
                  Y: =16
                  Width: =120
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Fill: =corPrimaria
                  Color: =Color.White
                  HoverFill: =corPrimariaEscura
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =0
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
            - htmlKpisRC:
                Control: HtmlViewer@2.1.0
                Properties:
                  HtmlText: |-
                    =With(
                        {
                            hoje: CountRows(Filter(colRecep; DateDiff(Today(); PrevistoPara; TimeUnit.Days) = 0));
                            amanha: CountRows(Filter(colRecep; DateDiff(Today(); PrevistoPara; TimeUnit.Days) = 1));
                            prox: CountRows(Filter(colRecep; DateDiff(Today(); PrevistoPara; TimeUnit.Days) >= 0 && DateDiff(Today(); PrevistoPara; TimeUnit.Days) <= gDiasRecepcao));
                            atras: CountRows(Filter(colRecep; PrevistoPara < Today() && Status = "PREVISTO"));
                            cate: CountRows(Filter(colRecep; PrecisaCateterismo));
                            h: colRecepHist
                        };
                        With(
                            {n: CountRows(Filter(h; Status <> "CANCELADO"))};
                            "<div style='display:flex;flex-wrap:wrap;gap:12px;font-family:Segoe UI,Arial,sans-serif'>" &
                            "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                            "<div style='font-size:12px;color:#5A6573'>Chegam hoje</div>" &
                            "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexTexto & "'>" & hoje & "</div>" &
                            "<div style='font-size:11px;color:#5A6573'>" & "amanhã: " & amanha & "</div>" &
                        "</div>" &
                            "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                            "<div style='font-size:12px;color:#5A6573'>Próximos dias</div>" &
                            "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexTexto & "'>" & prox & "</div>" &
                            "<div style='font-size:11px;color:#5A6573'>" & "até " & gDiasRecepcao & " dias à frente · " & cate & " com cateterismo" & "</div>" &
                        "</div>" &
                            "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                            "<div style='font-size:12px;color:#5A6573'>Atrasados</div>" &
                            "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & If(atras > 0; hexVermelho; hexVerde) & "'>" & atras & "</div>" &
                            "<div style='font-size:11px;color:#5A6573'>" & "data prevista passou e não chegaram" & "</div>" &
                        "</div>" &
                            "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                            "<div style='font-size:12px;color:#5A6573'>Retornaram à origem (30 d)</div>" &
                            "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexTexto & "'>" & If(n = 0; "–"; Text(CountRows(Filter(h; Status = "RETORNOU_ORIGEM")) / n * 100; "0") & "%") & "</div>" &
                            "<div style='font-size:11px;color:#5A6573'>" & CountRows(Filter(h; Status = "INTERNADO")) & " internaram · " & CountRows(Filter(h; Status = "RETORNOU_ORIGEM")) & " retornaram" & "</div>" &
                        "</div>" &
                            "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                            "<div style='font-size:12px;color:#5A6573'>Não compareceram (30 d)</div>" &
                            "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexTexto & "'>" & If(n = 0; "–"; Text(CountRows(Filter(h; Status = "NAO_COMPARECEU")) / n * 100; "0") & "%") & "</div>" &
                            "<div style='font-size:11px;color:#5A6573'>" & CountRows(Filter(h; Status = "NAO_COMPARECEU")) & " paciente(s)" & "</div>" &
                        "</div>" &
                            "</div>"
                        )
                    )
                  X: =20
                  Y: =66
                  Width: =Parent.Width - 40
                  Height: =96
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - btnAbaHOJERC:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="Hoje"
                  OnSelect: |-
                    =Set(varAbaRecep; "HOJE")
                  X: =20
                  Y: =172
                  Width: =134
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
