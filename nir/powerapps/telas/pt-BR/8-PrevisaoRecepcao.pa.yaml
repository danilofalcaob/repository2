                  Color: |-
                    =If(varAbaRecep = "HOJE"; Color.White; corPrimaria)
                  HoverFill: |-
                    =If(varAbaRecep = "HOJE"; corPrimariaEscura; corPrimariaClara)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  HoverColor: |-
                    =If(varAbaRecep = "HOJE"; Color.White; corPrimaria)
                  BorderColor: =corPrimaria
            - btnAbaAMANHARC:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
