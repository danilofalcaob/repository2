            - btnAbaPROXIMOSRC:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="Próximos dias"
                  OnSelect: |-
                    =Set(varAbaRecep; "PROXIMOS")
                  X: =300
                  Y: =172
                  Width: =134
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Fill: |-
                    =If(varAbaRecep = "PROXIMOS"; corPrimaria; Color.White)
                  Color: |-
                    =If(varAbaRecep = "PROXIMOS"; Color.White; corPrimaria)
                  HoverFill: |-
                    =If(varAbaRecep = "PROXIMOS"; corPrimariaEscura; corPrimariaClara)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  HoverColor: |-
                    =If(varAbaRecep = "PROXIMOS"; Color.White; corPrimaria)
                  BorderColor: =corPrimaria
            - btnAbaATRASADOSRC:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="Atrasados"
                  OnSelect: |-
                    =Set(varAbaRecep; "ATRASADOS")
                  X: =440
                  Y: =172
                  Width: =134
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Fill: |-
                    =If(varAbaRecep = "ATRASADOS"; corPrimaria; Color.White)
                  Color: |-
                    =If(varAbaRecep = "ATRASADOS"; Color.White; corPrimaria)
                  HoverFill: |-
                    =If(varAbaRecep = "ATRASADOS"; corPrimariaEscura; corPrimariaClara)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  HoverColor: |-
                    =If(varAbaRecep = "ATRASADOS"; Color.White; corPrimaria)
                  BorderColor: =corPrimaria
            - btnAbaHISTRC:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="Desfechos 30 d"
                  OnSelect: |-
                    =Set(varAbaRecep; "HIST")
                  X: =580
                  Y: =172
                  Width: =134
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Fill: |-
                    =If(varAbaRecep = "HIST"; corPrimaria; Color.White)
                  Color: |-
                    =If(varAbaRecep = "HIST"; Color.White; corPrimaria)
                  HoverFill: |-
                    =If(varAbaRecep = "HIST"; corPrimariaEscura; corPrimariaClara)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  HoverColor: |-
                    =If(varAbaRecep = "HIST"; Color.White; corPrimaria)
                  BorderColor: =corPrimaria
            - btnNovoRC:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="+ Novo paciente CROSS"
                  OnSelect: |-
                    =Set(varEditRC; Blank());; Set(varFormRecep; true)
                  X: =Parent.Width - 230
                  Y: =172
                  Width: =210
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Fill: =corPrimaria
                  Color: =Color.White
                  HoverFill: =corPrimariaEscura
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =0
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  Visible: =gEhNIR
            - lblSecAmbRC:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    ="Ambulatoriais (" & CountRows(galAmbRC.AllItems) & ")"
                  X: =20
                  Y: =218
                  Width: =Parent.Width / 2 - 30
                  Height: =26
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =13
                  Color: =corTexto
                  FontWeight: =FontWeight.Semibold
            - galAmbRC:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Items: |-
                    =Sort(
                        Filter(
                            If(varAbaRecep = "HIST"; colRecepHist; colRecep);
                            Secao = "AMBULATORIAL" && Switch(
                                varAbaRecep;
                                "HOJE"; DateDiff(Today(); PrevistoPara; TimeUnit.Days) = 0;
                                "AMANHA"; DateDiff(Today(); PrevistoPara; TimeUnit.Days) = 1;
                                "PROXIMOS"; DateDiff(Today(); PrevistoPara; TimeUnit.Days) >= 0 && DateDiff(Today(); PrevistoPara; TimeUnit.Days) <= gDiasRecepcao;
                                "ATRASADOS"; PrevistoPara < Today() && Status = "PREVISTO";
                                true
                            )
                        );
                        PrevistoPara;
                        If(varAbaRecep = "HIST"; SortOrder.Descending; SortOrder.Ascending)
                    )
                  X: =20
                  Y: =246
                  Width: =Parent.Width / 2 - 30
                  Height: =Parent.Height - 266
                  TemplateSize: =152
                  TemplatePadding: =0
                  ShowScrollbar: =true
                Children:
                  - recCardAmbRC:
                      Control: Rectangle@2.3.0
                      Properties:
                        X: =0
                        Y: =3
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight - 6
                        Fill: =corCard
                        BorderColor: =corBorda
                        BorderThickness: =1
                  - recFaixaAmbRC:
                      Control: Rectangle@2.3.0
                      Properties:
                        X: =0
                        Y: =3
                        Width: =6
                        Height: =Parent.TemplateHeight - 6
                        Fill: |-
                          =If(ThisItem.Status = "CHEGOU"; corVerde; ThisItem.Status = "PREVISTO" && ThisItem.PrevistoPara < Today(); corVermelho; ThisItem.Status = "PREVISTO"; corPrimaria; corCinza)
                  - lblPacAmbRC:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =ThisItem.Title & If(IsBlank(ThisItem.Idade); ""; ", " & ThisItem.Idade)
                        X: =14
                        Y: =6
                        Width: =Parent.TemplateWidth - 150
                        Height: =24
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =11
                        Color: =corTexto
                        FontWeight: =FontWeight.Semibold
                  - lblQuandoAmbRC:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =Text(ThisItem.PrevistoPara; "ddd dd/mm hh:mm")
                        X: =Parent.TemplateWidth - 140
                        Y: =6
                        Width: =130
                        Height: =24
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =10
                        Color: =corTexto
                        Align: =Align.Right
                        FontWeight: =FontWeight.Semibold
                  - lblOrigemAmbRC:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =ThisItem.ServicoOrigem & If(IsBlank(ThisItem.MunicipioOrigem); ""; " (" & ThisItem.MunicipioOrigem & ")") & If(IsBlank(ThisItem.Especialidade); ""; " · " & ThisItem.Especialidade) & If(IsBlank(ThisItem.SetorPrevisto); ""; " · destino " & Coalesce(LookUp(colSetores; Codigo = ThisItem.SetorPrevisto; Sigla); ThisItem.SetorPrevisto))
                        X: =14
                        Y: =30
                        Width: =Parent.TemplateWidth - 24
                        Height: =20
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =9
                        Color: =corTexto
                  - lblMotivoAmbRC:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="CROSS " & ThisItem.NrFichaCROSS & " · " & LookUp(tblStatusRecepcao; Codigo = ThisItem.Status; Value) & If(IsBlank(ThisItem.Motivo); ""; " · " & ThisItem.Motivo)
                        X: =14
                        Y: =50
                        Width: =Parent.TemplateWidth - 24
                        Height: =20
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =9
                        Color: =corTextoSuave
                  - btnCateAmbRC:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: |-
                          =If(ThisItem.PrecisaCateterismo; "✓ Cateterismo " & Text(ThisItem.DataCateterismo; "dd/mm hh:mm"); "Cateterismo?")
                        OnSelect: |-
                          =If(ThisItem.PrecisaCateterismo; Set(varCateEditRC; If(varCateEditRC = ThisItem.ID; Blank(); ThisItem.ID)); Set(varCateEditRC; ThisItem.ID))
                        X: =14
                        Y: =74
                        Width: =200
                        Height: =30
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =9
                        FontWeight: =FontWeight.Semibold
                        Fill: |-
                          =If(ThisItem.PrecisaCateterismo; corPrimaria; Color.White)
                        Color: |-
                          =If(ThisItem.PrecisaCateterismo; Color.White; corPrimaria)
                        HoverFill: |-
                          =If(ThisItem.PrecisaCateterismo; corPrimariaEscura; corPrimariaClara)
                        PressedFill: =corPrimariaEscura
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        DisabledFill: =corBorda
                        DisabledColor: =corTextoSuave
                        HoverColor: |-
                          =If(ThisItem.PrecisaCateterismo; Color.White; corPrimaria)
                        BorderColor: =corPrimaria
                        DisplayMode: |-
                          =If(gEhNIR && (ThisItem.Status = "PREVISTO" || ThisItem.Status = "CHEGOU"); DisplayMode.Edit; DisplayMode.View)
                  - dpCateAmbRC:
                      Control: Classic/DatePicker@2.6.0
                      Properties:
