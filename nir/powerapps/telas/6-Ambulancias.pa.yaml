                                  m: IfError(Value(Last(Split(txtHoraAM.Text, ":")).Value), 0)
                              },
                              DateAdd(DateAdd(dpDataAM.SelectedDate, If(h >= 0 && h < 24, h, 0), TimeUnit.Hours), If(m >= 0 && m < 60, m, 0), TimeUnit.Minutes)
                          )},
                                  If(
                                      IsBlank(varEditAM),
                                      Patch(
                                          Transportes,
                                          Defaults(Transportes),
