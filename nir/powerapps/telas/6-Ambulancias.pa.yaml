Screens:
  scrAmbulancias:
    Properties:
      Fill: =corFundo
      OnVisible: |-
        =If(IsBlank(varAbaAmb), Set(varAbaAmb, "24H")); Set(varFormAmb, false); Set(varEditAM, Blank()); Set(varRetornaAM, true);
        Select(btnAtualizarAM)
    Children:
      - recLateralAM:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =200
            Height: =Parent.Height
            Fill: =corPrimariaEscura
            BorderColor: =corBorda
            BorderThickness: =0
            Visible: =!varModoTV
      - lblMarcaAM:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="NIR · Command Center"
            X: =16
            Y: =14
            Width: =176
            Height: =30
            Font: |-
              =Font.'Segoe UI'
            Size: =14
            Color: =Color.White
            FontWeight: =FontWeight.Semibold
            Visible: =!varModoTV
      - lblHospitalAM:
          Control: Label@2.5.1
          Properties:
            Text: =gNomeHospital
            X: =16
            Y: =42
            Width: =176
            Height: =22
            Font: |-
              =Font.'Segoe UI'
            Size: =9
            Color: =RGBA(255, 255, 255, 0.75)
            Visible: =!varModoTV
      - galMenuAM:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =tblMenuUsuario
            X: =8
            Y: =80
            Width: =184
            Height: =Parent.Height - 170
            TemplateSize: =46
            TemplatePadding: =0
            ShowScrollbar: =false
            Visible: =!varModoTV
          Children:
            - btnMenuItemAM:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    =ThisItem.Rotulo & If(ThisItem.Disponivel, "", "  ·  em breve")
                  OnSelect: |-
                    =If(
                        !ThisItem.Disponivel,
                        Notify(ThisItem.Rotulo & " chega nas próximas fases do projeto.", NotificationType.Information),
                        Switch(
                            ThisItem.Codigo,
                            "PRINCIPAL", Navigate(scrPrincipal, ScreenTransition.None),
                            "ROTINA", Navigate(scrRotina, ScreenTransition.None),
                            "VAGAS", Navigate(scrVagas, ScreenTransition.None),
                            "METAS", Navigate(scrMetas, ScreenTransition.None),
                            "PREVISOES", Navigate(scrPrevisoes, ScreenTransition.None),
                            "PERMANENCIA", Navigate(scrPermanencia, ScreenTransition.None),
                            "AMBULANCIAS", Navigate(scrAmbulancias, ScreenTransition.None),
                            "CATETERISMOS", Navigate(scrCateterismos, ScreenTransition.None),
                            "PASSAGEM", Navigate(scrPassagem, ScreenTransition.None),
                            "RECEPCAO", Navigate(scrRecepcao, ScreenTransition.None)
                        )
                    )
                  X: =0
                  Y: =2
                  Width: =Parent.TemplateWidth
                  Height: =40
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Fill: |-
                    =If(ThisItem.Codigo = "AMBULANCIAS", corPrimaria, Color.Transparent)
                  Color: =If(ThisItem.Disponivel, Color.White, RGBA(255, 255, 255, 0.55))
                  HoverFill: =RGBA(255, 255, 255, 0.12)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =0
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  Align: =Align.Left
                  PaddingLeft: =12
                  HoverColor: =Color.White
      - lblUsuarioAM:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =gUsuarioNome & Char(10) & "Perfil: " & gPerfil
            X: =16
            Y: =Parent.Height - 72
            Width: =176
            Height: =56
            Font: |-
              =Font.'Segoe UI'
            Size: =9
            Color: =RGBA(255, 255, 255, 0.85)
            Visible: =!varModoTV
            VerticalAlign: =VerticalAlign.Bottom
      - conAM:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            X: =If(varModoTV, 0, 200)
            Y: =0
            Width: =Parent.Width - Self.X
            Height: =Parent.Height
            Fill: =corFundo
          Children:
            - lblTituloAM:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    ="Ambulâncias"
                  X: =20
                  Y: =10
                  Width: =560
                  Height: =30
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =18
                  Color: =corTexto
                  FontWeight: =FontWeight.Semibold
            - lblRelogioAM:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    =Text(varRelogio, "dddd, dd/mm/yyyy · hh:mm:ss") & "   ·   atualizado às " & Text(varUltimaAtualizacao, "hh:mm")
                  X: =20
                  Y: =40
                  Width: =620
                  Height: =20
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  Color: =corTextoSuave
            - btnAtualizarAM:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="Atualizar"
                  OnSelect: |-
                    =Refresh(Transportes);
                    Refresh(Internacoes);
                    ClearCollect(colInternados, Filter(Internacoes, Status = "INTERNADO"));
                    ClearCollect(
                        colTransp,
                        Filter(Transportes, Status = "AGENDADO" || Status = "SOLICITADA" || Status = "CONFIRMADA" || Status = "NO_LOCAL" || Status = "SAIU")
                    );
                    ClearCollect(
                        colTranspHist,
                        Filter(Transportes, AgendadoPara >= DateAdd(Today(), -30, TimeUnit.Days) && (Status = "RETORNOU" || Status = "CONCLUIDO" || Status = "CANCELADO"))
                    );
                    Set(varUltimaAtualizacao, Now())
                  X: =Parent.Width - 140
                  Y: =16
                  Width: =120
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Fill: =corPrimaria
                  Color: =Color.White
                  HoverFill: =corPrimariaEscura
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =0
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
            - htmlKpisAM:
                Control: HtmlViewer@2.1.0
                Properties:
                  HtmlText: |-
                    =With(
                        {agora: varUltimaAtualizacao},
                        With(
                            {
                                h24: Filter(colTransp, Status <> "SAIU" && AgendadoPara <= DateAdd(agora, 24, TimeUnit.Hours)),
                                h48: Filter(colTransp, Status <> "SAIU" && AgendadoPara > DateAdd(agora, 24, TimeUnit.Hours) && AgendadoPara <= DateAdd(agora, 48, TimeUnit.Hours)),
                                andamento: Filter(colTransp, Status = "SOLICITADA" || Status = "CONFIRMADA" || Status = "NO_LOCAL"),
                                radar: Filter(colTransp, Status = "SAIU"),
                                atras: Filter(colTransp, (Status = "AGENDADO" || Status = "SOLICITADA" || Status = "CONFIRMADA") && AgendadoPara < agora)
                            },
                            With(
                                {incompletos: CountRows(Filter(h24, (If(ChkAutorizacao, 1, 0) + If(ChkRelatorio, 1, 0) + If(ChkExames, 1, 0) + If(ChkContatoDestino, 1, 0) + If(ChkAgendaConfirmada, 1, 0) + If(ChkAcompanhante, 1, 0) + If(ChkEquipamentos, 1, 0) + If(ChkDocumentos, 1, 0) + If(ChkFamilia, 1, 0)) < 9))},
                                "<div style='display:flex;flex-wrap:wrap;gap:12px;font-family:Segoe UI,Arial,sans-serif'>" &
                                "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                            "<div style='font-size:12px;color:#5A6573'>Próximas 24 h</div>" &
                            "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexTexto & "'>" & CountRows(h24) & "</div>" &
                            "<div style='font-size:11px;color:#5A6573'>" & "24–48 h: " & CountRows(h48) & "</div>" &
                        "</div>" &
                                "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                            "<div style='font-size:12px;color:#5A6573'>Em andamento</div>" &
                            "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexPrimaria & "'>" & CountRows(andamento) & "</div>" &
                            "<div style='font-size:11px;color:#5A6573'>" & "ambulância pedida, confirmada ou no hospital" & "</div>" &
                        "</div>" &
                                "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                            "<div style='font-size:12px;color:#5A6573'>Checklist incompleto (24 h)</div>" &
                            "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & If(incompletos > 0, hexAmarelo, hexVerde) & "'>" & incompletos & "</div>" &
                            "<div style='font-size:11px;color:#5A6573'>" & "transportes com itens pendentes" & "</div>" &
                        "</div>" &
                                "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                            "<div style='font-size:12px;color:#5A6573'>Atrasados</div>" &
                            "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & If(CountRows(atras) > 0, hexVermelho, hexVerde) & "'>" & CountRows(atras) & "</div>" &
                            "<div style='font-size:11px;color:#5A6573'>" & "horário passou e o paciente não saiu" & "</div>" &
                        "</div>" &
                                "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                            "<div style='font-size:12px;color:#5A6573'>No radar</div>" &
                            "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexTexto & "'>" & CountRows(radar) & "</div>" &
                            "<div style='font-size:11px;color:#5A6573'>" & "fora do hospital, podem retornar" & "</div>" &
                        "</div>" &
                                "</div>"
                            )
                        )
                    )
                  X: =20
                  Y: =66
                  Width: =Parent.Width - 40
                  Height: =96
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - btnAba24HAM:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="Próximas 24 h"
                  OnSelect: |-
                    =Set(varAbaAmb, "24H")
                  X: =20
                  Y: =172
                  Width: =130
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Fill: |-
                    =If(varAbaAmb = "24H", corPrimaria, Color.White)
                  Color: |-
                    =If(varAbaAmb = "24H", Color.White, corPrimaria)
                  HoverFill: |-
                    =If(varAbaAmb = "24H", corPrimariaEscura, corPrimariaClara)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  HoverColor: |-
                    =If(varAbaAmb = "24H", Color.White, corPrimaria)
                  BorderColor: =corPrimaria
            - btnAba48HAM:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="24 a 48 h"
                  OnSelect: |-
                    =Set(varAbaAmb, "48H")
                  X: =156
                  Y: =172
                  Width: =130
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Fill: |-
                    =If(varAbaAmb = "48H", corPrimaria, Color.White)
                  Color: |-
                    =If(varAbaAmb = "48H", Color.White, corPrimaria)
                  HoverFill: |-
                    =If(varAbaAmb = "48H", corPrimariaEscura, corPrimariaClara)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  HoverColor: |-
                    =If(varAbaAmb = "48H", Color.White, corPrimaria)
                  BorderColor: =corPrimaria
            - btnAbaANDAMENTOAM:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="Em andamento"
                  OnSelect: |-
                    =Set(varAbaAmb, "ANDAMENTO")
                  X: =292
                  Y: =172
                  Width: =130
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Fill: |-
                    =If(varAbaAmb = "ANDAMENTO", corPrimaria, Color.White)
                  Color: |-
                    =If(varAbaAmb = "ANDAMENTO", Color.White, corPrimaria)
                  HoverFill: |-
                    =If(varAbaAmb = "ANDAMENTO", corPrimariaEscura, corPrimariaClara)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  HoverColor: |-
                    =If(varAbaAmb = "ANDAMENTO", Color.White, corPrimaria)
                  BorderColor: =corPrimaria
            - btnAbaRADARAM:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="Radar (fora)"
                  OnSelect: |-
                    =Set(varAbaAmb, "RADAR")
                  X: =428
                  Y: =172
                  Width: =130
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Fill: |-
                    =If(varAbaAmb = "RADAR", corPrimaria, Color.White)
                  Color: |-
                    =If(varAbaAmb = "RADAR", Color.White, corPrimaria)
                  HoverFill: |-
                    =If(varAbaAmb = "RADAR", corPrimariaEscura, corPrimariaClara)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  HoverColor: |-
                    =If(varAbaAmb = "RADAR", Color.White, corPrimaria)
                  BorderColor: =corPrimaria
            - btnAbaTODOSAM:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="Todos ativos"
                  OnSelect: |-
                    =Set(varAbaAmb, "TODOS")
                  X: =564
                  Y: =172
                  Width: =130
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Fill: |-
                    =If(varAbaAmb = "TODOS", corPrimaria, Color.White)
                  Color: |-
                    =If(varAbaAmb = "TODOS", Color.White, corPrimaria)
                  HoverFill: |-
                    =If(varAbaAmb = "TODOS", corPrimariaEscura, corPrimariaClara)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  HoverColor: |-
                    =If(varAbaAmb = "TODOS", Color.White, corPrimaria)
                  BorderColor: =corPrimaria
            - btnAbaHISTAM:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="Histórico 30 d"
                  OnSelect: |-
                    =Set(varAbaAmb, "HIST")
                  X: =700
                  Y: =172
                  Width: =130
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Fill: |-
                    =If(varAbaAmb = "HIST", corPrimaria, Color.White)
                  Color: |-
                    =If(varAbaAmb = "HIST", Color.White, corPrimaria)
                  HoverFill: |-
                    =If(varAbaAmb = "HIST", corPrimariaEscura, corPrimariaClara)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  HoverColor: |-
                    =If(varAbaAmb = "HIST", Color.White, corPrimaria)
                  BorderColor: =corPrimaria
            - btnNovoAM:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="+ Novo transporte"
                  OnSelect: |-
                    =Set(varEditAM, Blank()); Set(varRetornaAM, true); Reset(drpPacAM); Set(varFormAmb, true)
                  X: =Parent.Width - 200
                  Y: =172
                  Width: =180
                  Height: =36
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Fill: =corPrimaria
                  Color: =Color.White
                  HoverFill: =corPrimariaEscura
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =0
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  Visible: =gEhNIR
            - galTranspAM:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Items: |-
                    =Sort(
                        Filter(
                            If(varAbaAmb = "HIST", colTranspHist, colTransp),
                            Switch(
                                varAbaAmb,
                                "24H", Status <> "SAIU" && AgendadoPara <= DateAdd(varUltimaAtualizacao, 24, TimeUnit.Hours),
                                "48H", Status <> "SAIU" && AgendadoPara > DateAdd(varUltimaAtualizacao, 24, TimeUnit.Hours) && AgendadoPara <= DateAdd(varUltimaAtualizacao, 48, TimeUnit.Hours),
                                "ANDAMENTO", Status = "SOLICITADA" || Status = "CONFIRMADA" || Status = "NO_LOCAL",
                                "RADAR", Status = "SAIU",
                                true
                            )
                        ),
                        AgendadoPara,
                        If(varAbaAmb = "HIST", SortOrder.Descending, SortOrder.Ascending)
                    )
                  X: =20
                  Y: =218
                  Width: =Parent.Width - 40
                  Height: =Parent.Height - 238
                  TemplateSize: =150
                  TemplatePadding: =0
                  ShowScrollbar: =true
                Children:
                  - recCardAM:
                      Control: Rectangle@2.3.0
                      Properties:
                        X: =0
                        Y: =3
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight - 6
                        Fill: =corCard
                        BorderColor: =corBorda
                        BorderThickness: =1
                  - recFaixaAM:
                      Control: Rectangle@2.3.0
                      Properties:
                        X: =0
                        Y: =3
                        Width: =6
                        Height: =Parent.TemplateHeight - 6
                        Fill: |-
                          =If(ThisItem.Status = "SAIU", corPrimaria, ThisItem.AgendadoPara < varRelogio && ThisItem.Status <> "NO_LOCAL", corVermelho, (If(ThisItem.ChkAutorizacao, 1, 0) + If(ThisItem.ChkRelatorio, 1, 0) + If(ThisItem.ChkExames, 1, 0) + If(ThisItem.ChkContatoDestino, 1, 0) + If(ThisItem.ChkAgendaConfirmada, 1, 0) + If(ThisItem.ChkAcompanhante, 1, 0) + If(ThisItem.ChkEquipamentos, 1, 0) + If(ThisItem.ChkDocumentos, 1, 0) + If(ThisItem.ChkFamilia, 1, 0)) < 9, corAmarelo, corVerde)
                  - lblPacAM:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =ThisItem.Title & If(IsBlank(ThisItem.NrAtendimento), "", "  ·  atend. " & ThisItem.NrAtendimento)
                        X: =16
                        Y: =6
                        Width: =520
                        Height: =24
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =11
                        Color: =corTexto
                        FontWeight: =FontWeight.Semibold
                  - lblRotaAM:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =Coalesce(LookUp(colSetores, Codigo = ThisItem.SetorOrigem, Sigla), ThisItem.SetorOrigem) & If(IsBlank(ThisItem.Leito), "", " leito " & ThisItem.Leito) & "  →  " & ThisItem.Destino & If(IsBlank(ThisItem.Empresa), "", " · " & ThisItem.Empresa) & " · " & LookUp(tblTiposTransporte, Codigo = ThisItem.TipoTransporte, Value) & " · " & LookUp(tblMotivosTransporte, Codigo = ThisItem.Motivo, Value)
                        X: =16
                        Y: =30
                        Width: =Parent.TemplateWidth - 300
                        Height: =22
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =10
                        Color: =corTexto
                  - lblObsAM:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =If(IsBlank(ThisItem.Observacao), "", ThisItem.Observacao)
                        X: =16
                        Y: =52
                        Width: =Parent.TemplateWidth - 300
                        Height: =20
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =9
                        Color: =corTextoSuave
                  - lblQuandoAM:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =Text(ThisItem.AgendadoPara, "ddd dd/mm hh:mm") & "  ·  " &
                                With(
                                    {m: DateDiff(varRelogio, ThisItem.AgendadoPara, TimeUnit.Minutes)},
                                    If(
                                        ThisItem.Status = "SAIU", "fora desde " & Text(ThisItem.SaidaPacienteEm, "dd/mm hh:mm"),
                                        varAbaAmb = "HIST", LookUp(tblStatusTransporte, Codigo = ThisItem.Status, Value),
                                        m >= 0, "em " & If(m >= 60, RoundDown(m / 60, 0) & "h" & Text(Mod(m, 60), "00"), m & " min"),
                                        "atrasado " & If(-m >= 60, RoundDown(-m / 60, 0) & "h" & Text(Mod(-m, 60), "00"), -m & " min")
                                    )
                                )
                        X: =Parent.TemplateWidth - 300
                        Y: =6
                        Width: =288
                        Height: =24
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =10
                        Color: =corTexto
                        Align: =Align.Right
                        FontWeight: =FontWeight.Semibold
                  - lblStatusAM:
                      Control: Label@2.5.1
                      Properties:
                        Text: =LookUp(tblStatusTransporte, Codigo = ThisItem.Status, Value)
                        X: =Parent.TemplateWidth - 300
                        Y: =30
                        Width: =288
                        Height: =20
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =9
                        Color: =corPrimaria
                        Align: =Align.Right
                  - btnChkAutorizacaoAM:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: |-
                          =If(ThisItem.ChkAutorizacao, "✓ ", "") & "Autorização"
                        OnSelect: |-
                          =With(
                              {id: ThisItem.ID, v: !ThisItem.ChkAutorizacao},
                              Patch(Transportes, LookUp(Transportes, ID = id), {ChkAutorizacao: v, AtualizadoPorNome: gUsuarioNome});
                              Patch(colTransp, LookUp(colTransp, ID = id), {ChkAutorizacao: v})
                          )
                        X: =16
                        Y: =78
                        Width: =118
                        Height: =28
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =8
