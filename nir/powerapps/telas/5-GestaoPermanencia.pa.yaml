Screens:
  scrPermanencia:
    Properties:
      Fill: =corFundo
      OnVisible: |-
        =If(IsBlank(varFiltroSetorPM), Set(varFiltroSetorPM, "TODOS")); If(IsBlank(varEspPM), Set(varEspPM, If(IsBlank(gEspecialidadeUsuario), "MEDICO", gEspecialidadeUsuario)));
        Select(btnAtualizarPM)
    Children:
      - recLateralPM:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =200
            Height: =Parent.Height
            Fill: =corPrimariaEscura
            BorderColor: =corBorda
            BorderThickness: =0
            Visible: =!varModoTV
      - lblMarcaPM:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="NIR · Command Center"
            X: =16
            Y: =14
            Width: =176
            Height: =30
            Font: |-
              =Font.'Segoe UI'
            Size: =14
            Color: =Color.White
            FontWeight: =FontWeight.Semibold
            Visible: =!varModoTV
      - lblHospitalPM:
          Control: Label@2.5.1
          Properties:
            Text: =gNomeHospital
            X: =16
            Y: =42
            Width: =176
            Height: =22
            Font: |-
              =Font.'Segoe UI'
            Size: =9
            Color: =RGBA(255, 255, 255, 0.75)
            Visible: =!varModoTV
      - galMenuPM:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =tblMenuUsuario
            X: =8
            Y: =80
            Width: =184
            Height: =Parent.Height - 170
            TemplateSize: =46
            TemplatePadding: =0
            ShowScrollbar: =false
            Visible: =!varModoTV
          Children:
            - btnMenuItemPM:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    =ThisItem.Rotulo & If(ThisItem.Disponivel, "", "  ·  em breve")
                  OnSelect: |-
                    =If(
                        !ThisItem.Disponivel,
                        Notify(ThisItem.Rotulo & " chega nas próximas fases do projeto.", NotificationType.Information),
                        Switch(
                            ThisItem.Codigo,
                            "PRINCIPAL", Navigate(scrPrincipal, ScreenTransition.None),
                            "ROTINA", Navigate(scrRotina, ScreenTransition.None),
                            "VAGAS", Navigate(scrVagas, ScreenTransition.None),
                            "METAS", Navigate(scrMetas, ScreenTransition.None),
                            "PREVISOES", Navigate(scrPrevisoes, ScreenTransition.None),
                            "PERMANENCIA", Navigate(scrPermanencia, ScreenTransition.None),
                            "AMBULANCIAS", Navigate(scrAmbulancias, ScreenTransition.None),
                            "CATETERISMOS", Navigate(scrCateterismos, ScreenTransition.None),
                            "PASSAGEM", Navigate(scrPassagem, ScreenTransition.None),
                            "RECEPCAO", Navigate(scrRecepcao, ScreenTransition.None)
                        )
                    )
                  X: =0
                  Y: =2
                  Width: =Parent.TemplateWidth
                  Height: =40
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Fill: |-
                    =If(ThisItem.Codigo = "PERMANENCIA", corPrimaria, Color.Transparent)
                  Color: =If(ThisItem.Disponivel, Color.White, RGBA(255, 255, 255, 0.55))
                  HoverFill: =RGBA(255, 255, 255, 0.12)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =0
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  Align: =Align.Left
                  PaddingLeft: =12
                  HoverColor: =Color.White
      - lblUsuarioPM:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =gUsuarioNome & Char(10) & "Perfil: " & gPerfil
            X: =16
            Y: =Parent.Height - 72
            Width: =176
            Height: =56
            Font: |-
              =Font.'Segoe UI'
            Size: =9
            Color: =RGBA(255, 255, 255, 0.85)
            Visible: =!varModoTV
            VerticalAlign: =VerticalAlign.Bottom
      - conRolPM:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            X: =If(varModoTV, 0, 200)
            Y: =0
            Width: =Parent.Width - Self.X
            Height: =Parent.Height
            Fill: =corFundo
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =14
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =16
            PaddingBottom: =24
            PaddingLeft: =20
            PaddingRight: =20
          Children:
            - conCabPM:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  Height: =52
                  FillPortions: =0
                  LayoutMinHeight: =52
                  Fill: =Color.Transparent
                Children:
                  - lblTituloPM:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="Gestão da Permanência"
                        X: =0
                        Y: =0
                        Width: =520
                        Height: =30
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =18
                        Color: =corTexto
                        FontWeight: =FontWeight.Semibold
                  - lblRelogioPM:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =Text(varRelogio, "dddd, dd/mm/yyyy · hh:mm:ss") & "   ·   atualizado às " & Text(varUltimaAtualizacao, "hh:mm")
                        X: =0
                        Y: =30
                        Width: =620
                        Height: =20
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =10
                        Color: =corTextoSuave
                  - btnAtualizarPM:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: |-
                          ="Atualizar"
                        OnSelect: |-
                          =Refresh(Internacoes);
                          Refresh(PermanenciaAcompanhamento);
                          Refresh(PermanenciaTopicos);
                          ClearCollect(colInternados, Filter(Internacoes, Status = "INTERNADO"));
                          ClearCollect(colAcomp, PermanenciaAcompanhamento);
                          ClearCollect(colTopicos, Filter(PermanenciaTopicos, Status = "PLANEJADO" || Status = "EM_ANDAMENTO"));
                          Collect(colTopicos, Filter(PermanenciaTopicos, Status = "CONCLUIDO" && ConcluidoEm >= DateAdd(Today(), -30, TimeUnit.Days)));
                          ClearCollect(
                              colPerm,
                              AddColumns(
                                  Filter(colInternados, !IsBlank(DataInternacao) && DateDiff(DataInternacao, Today(), TimeUnit.Days) >= gDiasPermanencia),
                                  Dias, DateDiff(DataInternacao, Today(), TimeUnit.Days)
                              )
                          );

                          ClearCollect(
                              colPermView,
                              ForAll(
                                  colPerm As p,
                                  With(
                                      {a: LookUp(colAcomp, Title = p.Title)},
                                      {
                                          ID: p.ID,
                                          Title: p.Title,
                                          Paciente: p.Paciente,
                                          Leito: p.Leito,
                                          SetorCodigo: p.SetorCodigo,
                                          Medico: p.Medico,
                                          Dias: p.Dias,
                                          PrevisaoAlta: p.PrevisaoAlta,
                                          OrdemSetor: LookUp(colSetores, Codigo = p.SetorCodigo, Ordem),
                                          AcId: a.ID,
                                          PendMedico: Coalesce(a.PendMedico, false),
                                          nMed: CountRows(Filter(colTopicos, NrAtendimento = p.Title && Especialidade = "MEDICO" && Status <> "CONCLUIDO")),
                                          PendEnfermagem: Coalesce(a.PendEnfermagem, false),
                                          nEnf: CountRows(Filter(colTopicos, NrAtendimento = p.Title && Especialidade = "ENFERMAGEM" && Status <> "CONCLUIDO")),
                                          PendServicoSocial: Coalesce(a.PendServicoSocial, false),
                                          nSS: CountRows(Filter(colTopicos, NrAtendimento = p.Title && Especialidade = "SERVICO_SOCIAL" && Status <> "CONCLUIDO")),
                                          PendFisioterapia: Coalesce(a.PendFisioterapia, false),
                                          nFisio: CountRows(Filter(colTopicos, NrAtendimento = p.Title && Especialidade = "FISIOTERAPIA" && Status <> "CONCLUIDO")),
                                          DestinoAltaPrevisto: a.DestinoAltaPrevisto,
                                          PlanoTerapeutico: a.PlanoTerapeutico,
                                          ObsAcomp: a.Observacao,
                                          UltimaRevisaoEm: a.UltimaRevisaoEm,
                                          UltimaRevisaoPor: a.UltimaRevisaoPor
                                      }
                                  )
                              )
                          );
                          Set(varUltimaAtualizacao, Now())
                        X: =Parent.Width - 120
                        Y: =8
                        Width: =120
                        Height: =36
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =11
                        FontWeight: =FontWeight.Semibold
                        Fill: =corPrimaria
                        Color: =Color.White
                        HoverFill: =corPrimariaEscura
                        PressedFill: =corPrimariaEscura
                        BorderThickness: =0
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        DisabledFill: =corBorda
                        DisabledColor: =corTextoSuave
            - conDashPM:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  Height: =236
                  FillPortions: =0
                  LayoutMinHeight: =236
                  Fill: =Color.Transparent
                Children:
                  - lblSecDashPM:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="Painel da permanência (pacientes com 15 dias ou mais)"
                        X: =0
                        Y: =0
                        Width: =700
                        Height: =24
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =13
                        Color: =corTexto
                        FontWeight: =FontWeight.Semibold
                  - htmlDashPM:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        HtmlText: |-
                          =With(
                              {
                                  n: CountRows(colPermView),
                                  f1: CountRows(Filter(colPermView, Dias < 30)),
                                  f2: CountRows(Filter(colPermView, Dias >= 30 && Dias < 60)),
                                  f3: CountRows(Filter(colPermView, Dias >= 60)),
                                  semPrev: CountRows(Filter(colPermView, IsBlank(PrevisaoAlta))),
                                  abertos: Filter(colTopicos, Status <> "CONCLUIDO" && NrAtendimento in colPermView.Title),
                                  atrasados: CountRows(Filter(colTopicos, Status <> "CONCLUIDO" && !IsBlank(Prazo) && Prazo < Today() && NrAtendimento in colPermView.Title))
                              },
                              "<div style='font-family:Segoe UI,Arial,sans-serif'>" &
                              "<div style='display:flex;flex-wrap:wrap;gap:12px'>" &
                              "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                                  "<div style='font-size:12px;color:#5A6573'>Pacientes com ≥ 15 dias</div>" &
                                  "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexTexto & "'>" & n & "</div>" &
                                  "<div style='font-size:11px;color:#5A6573'>" & "15–29 d: " & f1 & " · 30–59 d: " & f2 & " · ≥ 60 d: " & f3 & "</div>" &
                              "</div>" &
                              "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                                  "<div style='font-size:12px;color:#5A6573'>Sem previsão de alta</div>" &
                                  "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & If(semPrev > 0, hexVermelho, hexVerde) & "'>" & semPrev & "</div>" &
                                  "<div style='font-size:11px;color:#5A6573'>" & "todos devem ter previsão" & "</div>" &
                              "</div>" &
                              "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                                  "<div style='font-size:12px;color:#5A6573'>Tópicos em aberto</div>" &
                                  "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexTexto & "'>" & CountRows(abertos) & "</div>" &
                                  "<div style='font-size:11px;color:#5A6573'>" & CountRows(Filter(abertos, Status = "PLANEJADO")) & " planejados · " & CountRows(Filter(abertos, Status = "EM_ANDAMENTO")) & " em andamento" & "</div>" &
                              "</div>" &
                              "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                                  "<div style='font-size:12px;color:#5A6573'>Tópicos com prazo vencido</div>" &
                                  "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & If(atrasados > 0, hexVermelho, hexVerde) & "'>" & atrasados & "</div>" &
                                  "<div style='font-size:11px;color:#5A6573'>" & "planejados ou em andamento" & "</div>" &
                              "</div>" &
                              "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                                  "<div style='font-size:12px;color:#5A6573'>Concluídos (30 dias)</div>" &
                                  "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexVerde & "'>" & CountRows(Filter(colTopicos, Status = "CONCLUIDO")) & "</div>" &
                                  "<div style='font-size:11px;color:#5A6573'>" & "pendências resolvidas" & "</div>" &
                              "</div>" &
                              "</div>" &
                              "<table style='width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;color:#1A2330'>" &
                              "<tr style='text-align:left;color:#5A6573;border-bottom:1px solid #D8DEE6'><th>Especialidade</th><th>Pacientes com pendência</th><th>Planejado</th><th>Em andamento</th><th>Concluído (30 d)</th></tr>" &
                              "<tr style='border-bottom:1px solid #EEF1F4'><td>Médico</td><td>" & CountRows(Filter(colPermView, PendMedico)) & "</td><td>" & CountRows(Filter(colTopicos, Especialidade = "MEDICO" && Status = "PLANEJADO")) & "</td><td>" & CountRows(Filter(colTopicos, Especialidade = "MEDICO" && Status = "EM_ANDAMENTO")) & "</td><td>" & CountRows(Filter(colTopicos, Especialidade = "MEDICO" && Status = "CONCLUIDO")) & "</td></tr>" &
                              "<tr style='border-bottom:1px solid #EEF1F4'><td>Enfermagem</td><td>" & CountRows(Filter(colPermView, PendEnfermagem)) & "</td><td>" & CountRows(Filter(colTopicos, Especialidade = "ENFERMAGEM" && Status = "PLANEJADO")) & "</td><td>" & CountRows(Filter(colTopicos, Especialidade = "ENFERMAGEM" && Status = "EM_ANDAMENTO")) & "</td><td>" & CountRows(Filter(colTopicos, Especialidade = "ENFERMAGEM" && Status = "CONCLUIDO")) & "</td></tr>" &
                              "<tr style='border-bottom:1px solid #EEF1F4'><td>Serviço Social</td><td>" & CountRows(Filter(colPermView, PendServicoSocial)) & "</td><td>" & CountRows(Filter(colTopicos, Especialidade = "SERVICO_SOCIAL" && Status = "PLANEJADO")) & "</td><td>" & CountRows(Filter(colTopicos, Especialidade = "SERVICO_SOCIAL" && Status = "EM_ANDAMENTO")) & "</td><td>" & CountRows(Filter(colTopicos, Especialidade = "SERVICO_SOCIAL" && Status = "CONCLUIDO")) & "</td></tr>" &
                              "<tr style='border-bottom:1px solid #EEF1F4'><td>Fisioterapia</td><td>" & CountRows(Filter(colPermView, PendFisioterapia)) & "</td><td>" & CountRows(Filter(colTopicos, Especialidade = "FISIOTERAPIA" && Status = "PLANEJADO")) & "</td><td>" & CountRows(Filter(colTopicos, Especialidade = "FISIOTERAPIA" && Status = "EM_ANDAMENTO")) & "</td><td>" & CountRows(Filter(colTopicos, Especialidade = "FISIOTERAPIA" && Status = "CONCLUIDO")) & "</td></tr>" &
                              "</table></div>"
                          )
                        X: =0
                        Y: =28
                        Width: =Parent.Width
                        Height: =206
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
            - conListaPM:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  Height: =380
                  FillPortions: =0
                  LayoutMinHeight: =380
                  Fill: =Color.Transparent
                Children:
                  - recListaPM:
                      Control: Rectangle@2.3.0
                      Properties:
                        X: =0
                        Y: =0
                        Width: =Parent.Width
                        Height: =380
                        Fill: =corCard
                        BorderColor: =corBorda
                        BorderThickness: =1
                  - lblSecListaPM:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="Pacientes (" & CountRows(galPacPM.AllItems) & ") · marque a especialidade que tem pendência para abrir o Kanban"
                        X: =16
                        Y: =8
                        Width: =900
                        Height: =24
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =13
                        Color: =corTexto
                        FontWeight: =FontWeight.Semibold
                  - drpSetorPM:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        Items: |-
                          =Ungroup(
                              Table(
                                  {Grupo: Table({Value: "Todos os setores", Codigo: "TODOS"})},
                                  {Grupo: ForAll(Filter(colSetores, Ativo) As s, {Value: s.Title, Codigo: s.Codigo})}
                              ),
                              Grupo
                          )
                        X: =16
                        Y: =38
                        Width: =240
                        Height: =36
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =11
                        BorderColor: =corBorda
                        ChevronBackground: =corPrimaria
                        Default: |-
                          =If(varFiltroSetorPM = "TODOS" || IsBlank(varFiltroSetorPM), "Todos os setores", LookUp(colSetores, Codigo = varFiltroSetorPM, Title))
                        OnChange: =Set(varFiltroSetorPM, Self.Selected.Codigo)
                  - txtBuscaPM:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        Default: |-
                          =""
                        X: =268
                        Y: =38
                        Width: =300
                        Height: =36
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =11
                        BorderColor: =corBorda
                        HintText: |-
                          ="Buscar paciente, leito ou atendimento"
                  - galPacPM:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Items: |-
                          =Sort(
                              Filter(
                                  colPermView,
                                  (varFiltroSetorPM = "TODOS" || SetorCodigo = varFiltroSetorPM) &&
                                  (IsBlank(txtBuscaPM.Text) || txtBuscaPM.Text in Paciente || txtBuscaPM.Text in Leito || txtBuscaPM.Text in Title)
                              ),
                              Dias,
                              SortOrder.Descending
                          )
                        X: =16
                        Y: =82
                        Width: =Parent.Width - 32
                        Height: =290
                        TemplateSize: =58
                        TemplatePadding: =0
                        ShowScrollbar: =true
                        OnSelect: |-
                          =Set(varPacPM, ThisItem.Title); If(IsBlank(varEspPM), Set(varEspPM, "MEDICO"))
                      Children:
                        - recSelPM:
                            Control: Rectangle@2.3.0
                            Properties:
                              X: =0
                              Y: =0
                              Width: =4
                              Height: =Parent.TemplateHeight
                              Fill: =corPrimaria
                              Visible: =ThisItem.Title = varPacPM
                        - lblLeitoPM:
                            Control: Label@2.5.1
                            Properties:
                              Text: =ThisItem.Leito
                              X: =10
                              Y: =6
                              Width: =64
                              Height: =24
                              Font: |-
                                =Font.'Segoe UI'
                              Size: =11
                              Color: =corTexto
                              FontWeight: =FontWeight.Semibold
                        - lblPacPM:
                            Control: Label@2.5.1
                            Properties:
                              Text: =ThisItem.Paciente
                              X: =78
                              Y: =4
                              Width: =300
                              Height: =24
                              Font: |-
                                =Font.'Segoe UI'
                              Size: =10
                              Color: =corTexto
                              FontWeight: =FontWeight.Semibold
                        - lblInfoPM:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                =Coalesce(LookUp(colSetores, Codigo = ThisItem.SetorCodigo, Sigla), ThisItem.SetorCodigo) & " · " & ThisItem.Dias & " dias · " & ThisItem.Medico
                              X: =78
                              Y: =28
                              Width: =300
                              Height: =20
                              Font: |-
                                =Font.'Segoe UI'
                              Size: =9
                              Color: =If(ThisItem.Dias >= 60, corVermelho, ThisItem.Dias >= 30, corAmarelo, corTextoSuave)
                        - lblPrevPM:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                =If(IsBlank(ThisItem.PrevisaoAlta), "Sem previsão de alta", "Alta prevista " & Text(ThisItem.PrevisaoAlta, "dd/mm"))
                              X: =384
                              Y: =16
                              Width: =170
                              Height: =24
                              Font: |-
                                =Font.'Segoe UI'
                              Size: =10
                              Color: =If(IsBlank(ThisItem.PrevisaoAlta), corVermelho, ThisItem.PrevisaoAlta < Today(), corAmarelo, corTexto)
                        - btnFlagMedPM:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: |-
                                =If(ThisItem.PendMedico, "✓ ", "") & "Médico" & If(ThisItem.nMed > 0, " (" & ThisItem.nMed & ")", "")
                              OnSelect: |-
                                =With(
                                    {p: ThisItem, novo: !ThisItem.PendMedico},
                                    If(
                                        IsBlank(p.AcId),
                                        Patch(
                                            PermanenciaAcompanhamento,
                                            Defaults(PermanenciaAcompanhamento),
                                            {
                                                Title: p.Title,
                                                Paciente: p.Paciente,
                                                SetorCodigo: p.SetorCodigo,
                                                PendMedico: novo,
                                                PendEnfermagem: false,
                                                PendServicoSocial: false,
                                                PendFisioterapia: false,
                                                UltimaRevisaoEm: Now(),
                                                UltimaRevisaoPor: gUsuarioNome
                                            }
                                        ),
                                        Patch(
                                            PermanenciaAcompanhamento,
                                            LookUp(PermanenciaAcompanhamento, ID = p.AcId),
                                            {PendMedico: novo, SetorCodigo: p.SetorCodigo, UltimaRevisaoEm: Now(), UltimaRevisaoPor: gUsuarioNome}
                                        )
                                    );
                                    ClearCollect(colAcomp, PermanenciaAcompanhamento);
                                    ClearCollect(
                                    colPermView,
                                    ForAll(
                                        colPerm As p,
                                        With(
                                            {a: LookUp(colAcomp, Title = p.Title)},
                                            {
                                                ID: p.ID,
                                                Title: p.Title,
                                                Paciente: p.Paciente,
                                                Leito: p.Leito,
                                                SetorCodigo: p.SetorCodigo,
                                                Medico: p.Medico,
                                                Dias: p.Dias,
                                                PrevisaoAlta: p.PrevisaoAlta,
                                                OrdemSetor: LookUp(colSetores, Codigo = p.SetorCodigo, Ordem),
                                                AcId: a.ID,
                                                PendMedico: Coalesce(a.PendMedico, false),
                                                nMed: CountRows(Filter(colTopicos, NrAtendimento = p.Title && Especialidade = "MEDICO" && Status <> "CONCLUIDO")),
                                                PendEnfermagem: Coalesce(a.PendEnfermagem, false),
                                                nEnf: CountRows(Filter(colTopicos, NrAtendimento = p.Title && Especialidade = "ENFERMAGEM" && Status <> "CONCLUIDO")),
                                                PendServicoSocial: Coalesce(a.PendServicoSocial, false),
                                                nSS: CountRows(Filter(colTopicos, NrAtendimento = p.Title && Especialidade = "SERVICO_SOCIAL" && Status <> "CONCLUIDO")),
                                                PendFisioterapia: Coalesce(a.PendFisioterapia, false),
