Screens:
  scrPrincipal:
    Properties:
      Fill: =corFundo
      OnVisible: =Select(btnAtualizarP)
    Children:
      - recLateralP:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =200
            Height: =Parent.Height
            Fill: =corPrimariaEscura
            BorderColor: =corBorda
            BorderThickness: =0
            Visible: =!varModoTV
      - lblMarcaP:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="NIR · Command Center"
            X: =16
            Y: =14
            Width: =176
            Height: =30
            Font: |-
              =Font.'Segoe UI'
            Size: =14
            Color: =Color.White
            FontWeight: =FontWeight.Semibold
            Visible: =!varModoTV
      - lblHospitalP:
          Control: Label@2.5.1
          Properties:
            Text: =gNomeHospital
            X: =16
            Y: =42
            Width: =176
            Height: =22
            Font: |-
              =Font.'Segoe UI'
            Size: =9
            Color: =RGBA(255, 255, 255, 0.75)
            Visible: =!varModoTV
      - galMenuP:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =tblMenuUsuario
            X: =8
            Y: =80
            Width: =184
            Height: =Parent.Height - 170
            TemplateSize: =46
            TemplatePadding: =0
            ShowScrollbar: =false
            Visible: =!varModoTV
          Children:
            - btnMenuItemP:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    =ThisItem.Rotulo & If(ThisItem.Disponivel, "", "  ·  em breve")
                  OnSelect: |-
                    =If(
                        !ThisItem.Disponivel,
                        Notify(ThisItem.Rotulo & " chega nas próximas fases do projeto.", NotificationType.Information),
                        Switch(
                            ThisItem.Codigo,
                            "PRINCIPAL", Navigate(scrPrincipal, ScreenTransition.None),
                            "ROTINA", Navigate(scrRotina, ScreenTransition.None),
                            "VAGAS", Navigate(scrVagas, ScreenTransition.None)
                        )
                    )
                  X: =0
                  Y: =2
                  Width: =Parent.TemplateWidth
                  Height: =40
                  Font: |-
                    =Font.'Segoe UI'
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Fill: |-
                    =If(ThisItem.Codigo = "PRINCIPAL", corPrimaria, Color.Transparent)
                  Color: =If(ThisItem.Disponivel, Color.White, RGBA(255, 255, 255, 0.55))
                  HoverFill: =RGBA(255, 255, 255, 0.12)
                  PressedFill: =corPrimariaEscura
                  BorderThickness: =0
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  DisabledFill: =corBorda
                  DisabledColor: =corTextoSuave
                  Align: =Align.Left
                  PaddingLeft: =12
                  HoverColor: =Color.White
      - lblUsuarioP:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =gUsuarioNome & Char(10) & "Perfil: " & gPerfil
            X: =16
            Y: =Parent.Height - 72
            Width: =176
            Height: =56
            Font: |-
              =Font.'Segoe UI'
            Size: =9
            Color: =RGBA(255, 255, 255, 0.85)
            Visible: =!varModoTV
            VerticalAlign: =VerticalAlign.Bottom
      - conPrincipal:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            X: =If(varModoTV, 0, 200)
            Y: =0
            Width: =Parent.Width - Self.X
            Height: =Parent.Height
            Fill: =corFundo
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =14
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =16
            PaddingBottom: =24
            PaddingLeft: =20
            PaddingRight: =20
          Children:
            - conCabP:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  Height: =52
                  FillPortions: =0
                  LayoutMinHeight: =52
                  Fill: =Color.Transparent
                Children:
                  - lblTituloP:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="Visão geral do NIR"
                        X: =0
                        Y: =0
                        Width: =520
                        Height: =30
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =18
                        Color: =corTexto
                        FontWeight: =FontWeight.Semibold
                  - lblRelogioP:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =Text(varRelogio, "dddd, dd/mm/yyyy · hh:mm:ss") & "   ·   atualizado às " & Text(varUltimaAtualizacao, "hh:mm")
                        X: =0
                        Y: =30
                        Width: =620
                        Height: =20
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =10
                        Color: =corTextoSuave
                  - btnModoTVP:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: |-
                          =If(varModoTV, "Sair do modo TV", "Modo TV")
                        OnSelect: =Set(varModoTV, !varModoTV)
                        X: =Parent.Width - 260
                        Y: =8
                        Width: =128
                        Height: =36
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =11
                        FontWeight: =FontWeight.Semibold
                        Fill: =Color.White
                        Color: =corPrimaria
                        HoverFill: =corPrimariaClara
                        PressedFill: =corPrimariaClara
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        DisabledFill: =corBorda
                        DisabledColor: =corTextoSuave
                        HoverColor: =corPrimaria
                        BorderColor: =corPrimaria
                  - btnAtualizarP:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: |-
                          ="Atualizar"
                        OnSelect: |-
                          =Set(varTick, varTick + 1);
                          Refresh(Internacoes);
                          Refresh(SolicitacoesVaga);
                          Refresh(Importacoes);
                          ClearCollect(colInternados, Filter(Internacoes, Status = "INTERNADO"));
                          ClearCollect(colVagasAbertas, Filter(SolicitacoesVaga, Status = "SOLICITADA" || Status = "EM_ANALISE" || Status = "LEITO_CEDIDO"));
                          ClearCollect(colImportDia, Filter(Importacoes, ChaveData = varChaveData && TipoGuia = "CENSO"));
                          If(
                              varTick = 1 || Mod(varTick, 5) = 0 || CountRows(colVagas30d) = 0,
                              ClearCollect(colSetores, Sort(Setores, Ordem));
                              ClearCollect(colSetoresRotina, Filter(colSetores, Ativo && ExigeNaRotina));
                              ClearCollect(colVagas30d, Filter(SolicitacoesVaga, SolicitadoEm >= DateAdd(Today(), -30, TimeUnit.Days)));
                              ClearCollect(colCenso14d, Filter(CensoResumo, DataRef >= DateAdd(Today(), -14, TimeUnit.Days)))
                          );

                          ClearCollect(
                              colRotinaStatus,
                              ForAll(
                                  tblJanelas As j,
                                  With(
                                      {
                                          rec: CountRows(Filter(colSetoresRotina, Codigo in Filter(colImportDia, Janela = j.Codigo).SetorCodigo)),
                                          esp: CountRows(colSetoresRotina),
                                          minAgora: varOffset * 60 + Minute(varRelogio),
                                          minPrev: Mod(j.HoraPrevista - gHoraInicioDia + 24, 24) * 60
                                      },
                                      {
                                          Codigo: j.Codigo,
                                          Rotulo: j.Rotulo,
                                          HoraPrevista: j.HoraPrevista,
                                          Ordem: j.Ordem,
                                          Recebidos: rec,
                                          Esperados: esp,
                                          Pct: If(esp = 0, 0, rec / esp),
                                          Situacao: If(
                                              esp > 0 && rec >= esp, "Concluída",
                                              minAgora < j.IniOffset * 60, "Aguardando",
                                              minAgora >= j.FimOffset * 60, "Incompleta",
                                              minAgora - minPrev > gToleranciaRotinaMin, "Atrasada",
                                              minAgora >= minPrev, "Em andamento",
                                              "Aberta"
                                          )
                                      }
                                  )
                              )
                          );
                          Set(varUltimaAtualizacao, Now())
                        X: =Parent.Width - 120
                        Y: =8
                        Width: =120
                        Height: =36
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =11
                        FontWeight: =FontWeight.Semibold
                        Fill: =corPrimaria
                        Color: =Color.White
                        HoverFill: =corPrimariaEscura
                        PressedFill: =corPrimariaEscura
                        BorderThickness: =0
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        DisabledFill: =corBorda
                        DisabledColor: =corTextoSuave
            - conRotinaP:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  Height: =146
                  FillPortions: =0
                  LayoutMinHeight: =146
                  Fill: =Color.Transparent
                Children:
                  - lblSecRotinaP:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="Rotina de atualização do dia"
                        X: =0
                        Y: =0
                        Width: =500
                        Height: =24
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =13
                        Color: =corTexto
                        FontWeight: =FontWeight.Semibold
                  - imgRotinaP:
                      Control: Image@2.2.3
                      Properties:
                        Image: |-
                          ="data:image/svg+xml;utf8," & EncodeUrl(
                              "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 96' font-family='Segoe UI, Arial, sans-serif'>" &
                              Concat(
                                  colRotinaStatus As j,
                                  With(
                                      {
                                          x: (j.Ordem - 1) * 275,
                                          cor: Switch(j.Situacao, "Concluída", hexVerde, "Atrasada", hexVermelho, "Incompleta", hexVermelho, "Em andamento", hexAmarelo, "Aberta", hexPrimaria, hexCinza),
                                          atual: j.Codigo = varJanela
                                      },
                                      "<g transform='translate(" & x & ",0)'>" &
                                      "<rect x='3' y='3' width='265' height='90' rx='12' fill='#FFFFFF' stroke='" & If(atual, hexPrimaria, hexBorda) & "' stroke-width='" & If(atual, "2.5", "1") & "'/>" &
                                      "<text x='18' y='30' font-size='16' font-weight='600' fill='" & hexTexto & "'>" & j.Rotulo & " · " & Text(j.HoraPrevista, "00") & "h" & If(atual, " (atual)", "") & "</text>" &
                                      "<text x='252' y='30' font-size='13' font-weight='600' text-anchor='end' fill='" & cor & "'>" & j.Situacao & "</text>" &
                                      "<rect x='18' y='44' width='234' height='12' rx='6' fill='" & hexTrilho & "'/>" &
                                      "<rect x='18' y='44' width='" & Text(234 * j.Pct, "0") & "' height='12' rx='6' fill='" & cor & "'/>" &
                                      "<text x='18' y='78' font-size='13' fill='" & hexTextoSuave & "'>" & j.Recebidos & " de " & j.Esperados & " setores · " & Text(j.Pct * 100, "0") & "%</text>" &
                                      "</g>"
                                  )
                              ) &
                              "</svg>"
                          )
                        X: =0
                        Y: =26
                        Width: =Parent.Width
                        Height: =96
                        ImagePosition: =ImagePosition.Fit
                        OnSelect: =If(gEhNIR, Navigate(scrRotina, ScreenTransition.None))
                  - lblFaltamP:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =With(
                              {
                                  faltam: Filter(colSetoresRotina, !(Codigo in Filter(colImportDia, Janela = varJanela).SetorCodigo)),
                                  rot: LookUp(tblJanelas, Codigo = varJanela, Rotulo)
                              },
                              If(
                                  CountRows(faltam) = 0,
                                  "Rotina da " & Lower(rot) & " completa: todos os setores foram atualizados.",
                                  "Faltam na rotina da " & Lower(rot) & " (" & CountRows(faltam) & "): " & Concat(faltam, Sigla, ", ")
                              )
                          )
                        X: =0
                        Y: =124
                        Width: =Parent.Width
                        Height: =22
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =10
                        Color: =corTextoSuave
            - conKpiP:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  Height: =104
                  FillPortions: =0
                  LayoutMinHeight: =104
                  Fill: =Color.Transparent
                Children:
                  - htmlKpisP:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        HtmlText: |-
                          =With(
                              {
                                  psCod: Filter(colSetores, Grupo = "PS").Codigo,
                                  utiCod: Filter(colSetores, Grupo = "UTI").Codigo,
                                  uiCod: Filter(colSetores, Grupo = "UI").Codigo,
                                  leitos: Sum(Filter(colSetores, Ativo && Grupo <> "PS"), LeitosOperacionais),
                                  aguard: Filter(colVagasAbertas, Status <> "LEITO_CEDIDO"),
                                  cedHoje: Filter(colVagas30d, !IsBlank(LeitoCedidoEm) && LeitoCedidoEm >= DateAdd(varDataRef, gHoraInicioDia, TimeUnit.Hours)),
                                  ced30: Filter(colVagas30d, !IsBlank(MinutosAteCessao))
                              },
                              With(
                                  {
                                      nPS: CountRows(Filter(colInternados, SetorCodigo in psCod)),
                                      nUTI: CountRows(Filter(colInternados, SetorCodigo in utiCod)),
                                      nUI: CountRows(Filter(colInternados, SetorCodigo in uiCod)),
                                      nAguard: CountRows(aguard),
                                      nCedidos: CountRows(Filter(colVagasAbertas, Status = "LEITO_CEDIDO")),
                                      nFora: CountRows(Filter(aguard, DateDiff(SolicitadoEm, varRelogio, TimeUnit.Minutes) > Coalesce(SLAMinutos, gSlaPadraoMin))),
                                      maiorMin: Max(aguard, DateDiff(SolicitadoEm, varRelogio, TimeUnit.Minutes)),
                                      nPSAguard: CountRows(Filter(aguard, SetorOrigem in psCod)),
                                      mediaHoje: IfError(Round(Average(cedHoje, MinutosAteCessao), 0), Blank()),
                                      media30: IfError(Round(Average(ced30, MinutosAteCessao), 0), Blank()),
                                      nCed30: CountRows(ced30),
                                      nSla30: CountRows(Filter(ced30, DentroSLA = "SIM"))
                                  },
                                  With(
                                      {ocup: If(leitos > 0, (nUTI + nUI) / leitos, Blank())},
                                      "<div style='display:flex;flex-wrap:wrap;gap:12px;font-family:Segoe UI,Arial,sans-serif'>" &
                                      "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                                  "<div style='font-size:12px;color:#5A6573'>Internados agora</div>" &
                                  "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexTexto & "'>" & (nPS + nUTI + nUI) & "</div>" &
                                  "<div style='font-size:11px;color:#5A6573'>" & "PS " & nPS & " · UTI " & nUTI & " · UI " & nUI & "</div>" &
                              "</div>" &
                                      "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                                  "<div style='font-size:12px;color:#5A6573'>Ocupação UTI + UI</div>" &
                                  "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & If(Coalesce(ocup, 0) >= 0.95, hexVermelho, Coalesce(ocup, 0) >= 0.85, hexAmarelo, hexTexto) & "'>" & If(IsBlank(ocup), "–", Text(ocup * 100, "0") & "%") & "</div>" &
                                  "<div style='font-size:11px;color:#5A6573'>" & If(leitos > 0, (nUTI + nUI) & " de " & leitos & " leitos", "cadastre os leitos na lista Setores") & "</div>" &
                              "</div>" &
                                      "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                                  "<div style='font-size:12px;color:#5A6573'>Aguardando leito</div>" &
                                  "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & If(nAguard > 0, hexPrimaria, hexTexto) & "'>" & nAguard & "</div>" &
                                  "<div style='font-size:11px;color:#5A6573'>" & nCedidos & " leito(s) cedido(s) aguardando transferência" & "</div>" &
                              "</div>" &
                                      "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                                  "<div style='font-size:12px;color:#5A6573'>Fora do SLA</div>" &
                                  "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & If(nFora > 0, hexVermelho, hexVerde) & "'>" & nFora & "</div>" &
                                  "<div style='font-size:11px;color:#5A6573'>" & If(nFora > 0, "solicitações acima do SLA", "nenhuma acima do SLA") & "</div>" &
                              "</div>" &
                                      "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                                  "<div style='font-size:12px;color:#5A6573'>Maior espera</div>" &
                                  "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & If(Coalesce(maiorMin, 0) > gSlaPadraoMin, hexVermelho, hexTexto) & "'>" & If(IsBlank(maiorMin), "–", maiorMin >= 60, RoundDown(maiorMin / 60, 0) & "h " & Text(Mod(maiorMin, 60), "00") & "min", Text(maiorMin, "0") & " min") & "</div>" &
                                  "<div style='font-size:11px;color:#5A6573'>" & "desde a solicitação" & "</div>" &
                              "</div>" &
                                      "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                                  "<div style='font-size:12px;color:#5A6573'>PS aguardando leito</div>" &
                                  "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & If(nPSAguard > 0, hexAmarelo, hexTexto) & "'>" & nPSAguard & "</div>" &
                                  "<div style='font-size:11px;color:#5A6573'>" & "pacientes do PS/Emergência" & "</div>" &
                              "</div>" &
                                      "<div style='flex:1 1 150px;min-width:150px;background:#FFFFFF;border:1px solid #D8DEE6;border-radius:12px;padding:10px 14px;box-sizing:border-box'>" &
                                  "<div style='font-size:12px;color:#5A6573'>Tempo até cessão (hoje)</div>" &
                                  "<div style='font-size:26px;font-weight:600;line-height:1.25;color:" & hexTexto & "'>" & If(IsBlank(mediaHoje), "–", mediaHoje >= 60, RoundDown(mediaHoje / 60, 0) & "h " & Text(Mod(mediaHoje, 60), "00") & "min", Text(mediaHoje, "0") & " min") & "</div>" &
                                  "<div style='font-size:11px;color:#5A6573'>" & "média 30 dias: " & If(IsBlank(media30), "–", media30 >= 60, RoundDown(media30 / 60, 0) & "h " & Text(Mod(media30, 60), "00") & "min", Text(media30, "0") & " min") & If(nCed30 > 0, " · " & Text(nSla30 / nCed30 * 100, "0") & "% no SLA", "") & "</div>" &
                              "</div>" &
                                      "</div>"
                                  )
                              )
                          )
                        X: =0
                        Y: =0
                        Width: =Parent.Width
                        Height: =104
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
            - conVagasP:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  Height: =330
                  FillPortions: =0
                  LayoutMinHeight: =330
                  Fill: =Color.Transparent
                Children:
                  - recCriticasP:
                      Control: Rectangle@2.3.0
                      Properties:
                        X: =0
                        Y: =0
                        Width: =Parent.Width * 0.55 - 7
                        Height: =330
                        Fill: =corCard
                        BorderColor: =corBorda
                        BorderThickness: =1
                  - lblSecCriticasP:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          ="Aguardando leito: maiores esperas"
                        X: =16
                        Y: =10
                        Width: =360
                        Height: =24
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =13
                        Color: =corTexto
                        FontWeight: =FontWeight.Semibold
                  - btnVerVagasP:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: |-
                          ="Abrir Gestão de Vagas"
                        OnSelect: |-
                          =Set(varFiltroSetor, "TODOS"); Navigate(scrVagas, ScreenTransition.None)
                        X: =Parent.Width * 0.55 - 7 - 196
                        Y: =8
                        Width: =180
                        Height: =30
                        Font: |-
                          =Font.'Segoe UI'
                        Size: =10
                        FontWeight: =FontWeight.Semibold
                        Fill: =Color.White
                        Color: =corPrimaria
                        HoverFill: =corPrimariaClara
                        PressedFill: =corPrimariaClara
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        DisabledFill: =corBorda
                        DisabledColor: =corTextoSuave
                        HoverColor: =corPrimaria
                        BorderColor: =corPrimaria
                  - galCriticasP:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Items: |-
                          =FirstN(
                              Sort(
                                  AddColumns(
                                      Filter(colVagasAbertas, Status <> "LEITO_CEDIDO"),
                                      PctSLA, DateDiff(SolicitadoEm, varUltimaAtualizacao, TimeUnit.Minutes) / Coalesce(SLAMinutos, gSlaPadraoMin)
                                  ),
                                  PctSLA,
                                  SortOrder.Descending
                              ),
                              6
                          )
                        X: =8
                        Y: =44
                        Width: =Parent.Width * 0.55 - 23
                        Height: =280
                        TemplateSize: =64
                        TemplatePadding: =0
                        ShowScrollbar: =true
                        OnSelect: =Navigate(scrVagas, ScreenTransition.None)
                      Children:
                        - recCorCritP:
                            Control: Rectangle@2.3.0
                            Properties:
                              X: =8
                              Y: =8
                              Width: =6
                              Height: =48
                              Fill: |-
                                =With(
                                    {p: DateDiff(ThisItem.SolicitadoEm, varRelogio, TimeUnit.Seconds) / (60 * Coalesce(ThisItem.SLAMinutos, gSlaPadraoMin))},
                                    If(p >= 1, corVermelho, p >= gSlaAlerta, corAmarelo, corVerde)
                                )
                        - lblPacCritP:
                            Control: Label@2.5.1
                            Properties:
                              Text: =ThisItem.Paciente
                              X: =24
                              Y: =6
                              Width: =Parent.TemplateWidth - 210
                              Height: =24
                              Font: |-
                                =Font.'Segoe UI'
                              Size: =11
                              Color: =corTexto
                              FontWeight: =FontWeight.Semibold
                        - lblRotaCritP:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                =Coalesce(LookUp(colSetores, Codigo = ThisItem.SetorOrigem, Sigla), ThisItem.SetorOrigem) & " (" & ThisItem.LeitoOrigem & ")  →  " & Coalesce(LookUp(colSetores, Codigo = ThisItem.SetorDestino, Sigla), ThisItem.SetorDestino) & "  ·  " & LookUp(tblCondicoes, Codigo = ThisItem.CondicaoTransporte, Value)
                              X: =24
                              Y: =32
                              Width: =Parent.TemplateWidth - 210
