                        HoverFill: =corPrimariaEscura
                        PressedFill: =corPrimariaEscura
                        BorderThickness: =0
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        DisabledFill: =corBorda
                        DisabledColor: =corTextoSuave
                        Visible: =gEhNIR || gPodePermanencia
